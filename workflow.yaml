# Agent Workflow DSL - Single Source of Truth
# Corrected version: aggregate audit handoff, routed re-review loops, independent counters.
#
# Conventions:
# - Forced-pass: when iteration >= max (3), the agent MUST set the forward-progress
#   signal regardless of remaining issues. For most agents this is pass=true.
#   For devops-infrastructure-engineer: deployment_complete=true.
#   Unresolved issues are documented in the output report.
# - Phase context: Phase 1 transitions (T23a/b/c) have phase: initial_audit_collect.
#   Phase 2 transitions have process: <bug_fix_process> which implicitly marks them as
#   verification-phase. The orchestrator uses incoming transition to determine phase.
#
# ═══════════════════════════════════════════════════════════════════════════════
# ORCHESTRATOR INSTRUCTIONS (for LLM-based orchestration via agent tool)
# ═══════════════════════════════════════════════════════════════════════════════
#
# How to determine the next agent after the current agent completes:
#
# 1. Read the agent's JSON result (status, artifacts, flags)
# 2. Find ALL transitions where `from` = current_agent
# 3. Evaluate conditions using the mapping below
# 4. Launch the next agent via: agent tool with subagent_type = transition's `to`
# 5. If multiple transitions match (parallel_start), launch ALL of them
#
# CONDITION EVALUATION RULES (map agent result → transition condition):
#
# ┌─────────────────────────────┬──────────────────────────────┬────────────────────────────────────┐
# │ Current Agent               │ Transition                   │ Condition = TRUE when              │
# ├─────────────────────────────┼──────────────────────────────┼────────────────────────────────────┤
# │ project-manager             │ T01 → architecture-planner   │ backlog_approved = true                    │
# │ project-manager             │ T70_REV → tech-docs-writer   │ documentation_needs_revision = true│
# │                             │                              │ AND documentation_iteration < 3    │
# ├─────────────────────────────┼──────────────────────────────┼────────────────────────────────────┤
# │ architecture-planner        │ T12a → security-auditor      │ architecture doc mentions security │
# │                             │                              │ requirements AND not all audits    │
# │                             │                              │ returned yet                       │
# │ architecture-planner        │ T12b → ui-ux-accessibility-specialist │ architecture doc mentions UI needs │
# │                             │                                       │ AND not all audits returned yet    │
# │ architecture-planner        │ T12c → data-engineering-architect     │ architecture doc mentions data/    │
# │                             │                                       │ pipeline needs AND not all audits  │
# │                             │                                       │ returned yet                       │
# │ architecture-planner        │ T13 → code-implementer       │ all audits returned (or none       │
# │                             │                              │ needed) — i.e. you have collected  │
# │                             │                              │ all Phase 1 results                │
# ├─────────────────────────────┼──────────────────────────────┼────────────────────────────────────┤
# │ security-auditor (Phase 1)  │ T23a → architecture-planner  │ always (any result) — collect audit│
# │ ui-ux-accessibility-specialist (Phase 1)  │ T23b → architecture-planner  │ always (any result) — collect audit│
# │ data-engineering-architect (Phase 1)│ T23c → architecture-planner  │ always (any result, except deployment_only) — collect audit│
# │                             │                              │ NOTE: if deployment_only=true, use T_DATA_TO_DEVOPS instead (skip to devops)
# ├─────────────────────────────┼──────────────────────────────┼────────────────────────────────────┤
# │ security-auditor (Phase 2)  │ T_SEC_VERIFY → code-implementer     │ findings NOT resolved AND iter < 3 │
# │                             │ T_SEC_PASS → code-reviewer   │ security_verification_pass OR iter >= 3 │
# │ ui-ux-accessibility-specialist (Phase 2)  │ T_UI_VERIFY → code-implementer      │ findings NOT resolved AND iter < 3 │
# │                             │ T_UI_PASS → code-reviewer    │ ui_verification_pass OR iter >= 3  │
# │ data-engineering-architect (Phase 2)│ T_DATA_VERIFY → code-implementer    │ findings NOT resolved AND iter < 3 │
# │                             │ T_DATA_PASS → code-reviewer  │ data_verification_pass OR iter >= 3 │
# │ data-engineering-architect          │ T_DATA_TO_DEVOPS → devops-infrastructure-engineer │ deployment_only = true │
# ├─────────────────────────────┼──────────────────────────────┼────────────────────────────────────┤
# │ code-implementer            │ T34 → code-reviewer          │ no fix flags present (initial impl │
# │                             │                              │ or fixing_review)                  │
# │                             │ T_CODE_TO_SEC → security-auditor  │ security_fixes_complete = true     │
# │                             │ T_CODE_TO_UI → ui-ux-accessibility-specialist    │ ui_fixes_complete = true           │
# │                             │ T_CODE_TO_DATA → data-engineering-architect    │ data_fixes_complete = true         │
# │                             │ T_CODE_TO_TEST → code-reviewer    │ test_fixes_complete = true         │
# │                             │ T_CODE_TO_PERF → code-reviewer    │ perf_fixes_complete = true         │
# ├─────────────────────────────┼──────────────────────────────┼────────────────────────────────────┤
# │ code-reviewer               │ T43 → code-implementer       │ issues_found = true AND iter < 3   │
# │                             │ T43_TEST → code-implementer  │ test_fix_review = true AND iter < 3│
# │                             │ T43_PERF → code-implementer  │ perf_fix_review = true AND iter < 3│
# │                             │ T45a → comprehensive-test-engineer         │ code_review_pass = true OR iter >= 3 │
# │                             │ T45b → performance-analyst   │ code_review_pass = true OR iter >= 3 │
# │                             │ T_DEVOPS_REVIEW_PASS         │ infrastructure_review_pass = true  │
# │                             │ → devops-infrastructure-engineer            │                                  │
# │                             │ T_DEVOPS_REVIEW_FAIL         │ infrastructure_review_pass = false │
# │                             │ → devops-infrastructure-engineer            │ AND iter < 3                     │
# │                             │ T_DEVOPS_REVIEW_FORCE_PASS   │ infrastructure_review_pass = false │
# │                             │ → devops-infrastructure-engineer            │ AND iter >= 3                    │
# ├─────────────────────────────┼──────────────────────────────┼────────────────────────────────────┤
# │ comprehensive-test-engineer │ T51_3 → code-implementer     │ bugs_found = true AND iter < 3     │
# │                             │ T51_6 → devops-infrastructure-engineer │ tests_pass = true OR iter >= 3 │
# │ performance-analyst         │ T52_3 → code-implementer     │ bottlenecks_found AND iter < 3     │
# │                             │ T52_6 → devops-infrastructure-engineer │ performance_pass = true OR iter >= 3 │
# ├─────────────────────────────┼──────────────────────────────┼────────────────────────────────────┤
# │ devops-infrastructure-engineer       │ T67 → tech-docs-writer       │ (deployment_complete AND NOT       │
# │                             │                              │ infrastructure_code_needs_review) OR iter >= 3    │
# │                             │ T_DEVOPS_REVIEW → code-reviewer   │ infrastructure_code_needs_review = true AND    │
# │                             │                              │ infrastructure_review_iteration < 3              │
# ├─────────────────────────────┼──────────────────────────────┼────────────────────────────────────┤
# │ tech-docs-writer            │ T70 → project-manager        │ documentation_complete = true      │
# │                             │                              │ OR documentation_iteration >= 3    │
# └─────────────────────────────┴──────────────────────────────┴────────────────────────────────────┘
#
# KEY RULES:
# - Phase 1 vs Phase 2: Phase 1 audits (T12a/b/c → T23a/b/c) happen BEFORE implementation.
#   Phase 2 verification (T_SEC_VERIFY/PASS, T_UI_VERIFY/PASS, T_DATA_VERIFY/PASS) happens AFTER
#   code-implementer fixes. Determine phase from the incoming transition to the audit agent.
# - parallel_start: launch BOTH agents (comprehensive-test-engineer + performance-analyst). Use agent tool twice.
# - parallel_join: devops-infrastructure-engineer starts only when BOTH comprehensive-test-engineer AND performance-analyst branches complete.
# - When iteration >= max: force forward progress regardless of issues (document unresolved issues).
# - code-implementer state: determined by incoming transition. Use state to pick correct outgoing
#   transition (T34 vs T_CODE_TO_SEC vs T_CODE_TO_UI vs T_CODE_TO_DATA vs T_CODE_TO_TEST vs T_CODE_TO_PERF).

agents:
- id: business-analyst
  name: business-analyst
  max_iterations: null
  escalation_path: null
  description: Requirements gathering, TZ creation, project context
  note: Entry point for /wf-orc:full and /wf-orc:research only — not part of standard workflow
- id: project-manager
  name: project-manager
  max_iterations: null
  escalation_path: null
  entry_point: true
  description: Project management, backlog, prioritization
- id: architecture-planner
  name: architecture-planner
  max_iterations: null
  escalation_path: null
  description: Architecture, planning, documentation
- id: security-auditor
  name: security-auditor
  max_iterations: 3
  escalation_path: architecture-planner
  escalation_final_destination: code-reviewer
  description: Security audit, vulnerabilities
- id: ui-ux-accessibility-specialist
  name: ui-ux-accessibility-specialist
  max_iterations: 3
  escalation_path: architecture-planner
  escalation_final_destination: code-reviewer
  description: UI specifications, accessibility, UX
- id: data-engineering-architect
  name: data-engineering-architect
  max_iterations: 3
  escalation_path: architecture-planner
  escalation_final_destination: code-reviewer
  description: ETL, SQL, data pipelines
- id: code-implementer
  name: code-implementer
  max_iterations: null
  escalation_path: null
  description: Code implementation, refactoring
  note: Iteration counter is reset after each successful review pass
  state_machine_semantics: descriptive  # States guide routing but agent can use any valid transition based on result flags
  states:
  - id: implementing
    description: Initial implementation from architecture documents
    incoming_transition: T13
    transitions:
    - T34
    - T_CODE_TO_SEC
    - T_CODE_TO_UI
    - T_CODE_TO_DATA
  - id: fixing_security
    description: Fixing security vulnerabilities identified by security-auditor
    incoming_transition: T_SEC_VERIFY
    transitions:
    - T_CODE_TO_SEC
  - id: fixing_ui
    description: Fixing UI/UX issues identified by ui-ux-accessibility-specialist
    incoming_transition: T_UI_VERIFY
    transitions:
    - T_CODE_TO_UI
  - id: fixing_data
    description: Fixing data architecture issues identified by data-engineering-architect
    incoming_transition: T_DATA_VERIFY
    transitions:
    - T_CODE_TO_DATA
  - id: fixing_review
    description: Fixing issues identified by code-reviewer (T43 loop)
    incoming_transition: T43
    transitions:
    - T34
  - id: fixing_test
    description: Fixing bugs identified by comprehensive-test-engineer — returns to code-reviewer for
      re-review
    incoming_transition: [T43_TEST, T51_3]
    transitions:
    - T_CODE_TO_TEST
  - id: fixing_perf
    description: Fixing performance bottlenecks identified by performance-analyst — returns to code-reviewer
      for re-review
    incoming_transition: [T43_PERF, T52_3]
    transitions:
    - T_CODE_TO_PERF
- id: code-reviewer
  name: code-reviewer
  max_iterations: 3
  escalation_path: null  # No escalation — after code-reviewer, workflow proceeds to T45a/T45b (test/performance)
  escalation_final_destination: comprehensive-test-engineer
  description: Independent code review, code quality
- id: comprehensive-test-engineer
  name: comprehensive-test-engineer
  max_iterations: 3
  escalation_path: null  # No escalation — after comprehensive-test-engineer, workflow proceeds to T51_3/T51_6
  escalation_final_destination: devops-infrastructure-engineer
  description: Testing, QA
- id: performance-analyst
  name: performance-analyst
  max_iterations: 3
  escalation_path: null  # No escalation — after performance-analyst, workflow proceeds to T52_3/T52_6
  escalation_final_destination: devops-infrastructure-engineer
  description: Profiling, load testing
- id: devops-infrastructure-engineer
  name: devops-infrastructure-engineer
  max_iterations: null
  escalation_path: null  # No escalation — after devops-infrastructure-engineer, workflow proceeds to T67/T_DEVOPS_REVIEW
  escalation_final_destination: tech-docs-writer
  description: CI/CD, infrastructure, deployment
- id: tech-docs-writer
  name: tech-docs-writer
  max_iterations: 3
  escalation_path: project-manager
  escalation_final_destination: project-manager
  description: Documentation, guides, ADRs
transitions:
- id: T01
  from: project-manager
  to: architecture-planner
  condition: backlog_approved
  artifacts:
  - product_backlog
  - user_stories
  - sprint_backlog
  type: serial
- id: T12a
  from: architecture-planner
  to: security-auditor
  condition: security_requirements_exist AND NOT all_audits_complete
  artifacts:
  - system_architecture_document
  - adrs
  - implementation_plan
  - component_specifications
  - data_flow_diagram
  type: conditional
- id: T12b
  from: architecture-planner
  to: ui-ux-accessibility-specialist
  condition: ui_needed AND NOT all_audits_complete
  artifacts:
  - system_architecture_document
  - adrs
  - implementation_plan
  - component_specifications
  - data_flow_diagram
  type: conditional
- id: T12c
  from: architecture-planner
  to: data-engineering-architect
  condition: data_design_needed AND NOT all_audits_complete
  artifacts:
  - system_architecture_document
  - adrs
  - implementation_plan
  - component_specifications
  - data_flow_diagram
  type: conditional
- id: T23a
  from: security-auditor
  to: architecture-planner
  condition: security_audit_complete_with_findings OR security_audit_complete_no_findings
  artifacts:
  - threat_model
  - security_requirements
  - security_checklist
  - security_findings_report
  type: serial
  phase: initial_audit_collect
- id: T23b
  from: ui-ux-accessibility-specialist
  to: architecture-planner
  condition: ui_audit_complete_with_findings OR ui_audit_complete_no_findings
  artifacts:
  - ui_component_specifications
  - user_flow_diagrams
  - accessibility_requirements
  - ui_findings_report
  type: serial
  phase: initial_audit_collect
- id: T23c
  from: data-engineering-architect
  to: architecture-planner
  condition: (data_audit_complete_with_findings OR data_audit_complete_no_findings) AND NOT deployment_only
  artifacts:
  - pipeline_configurations
  - data_models
  - optimized_queries
  - infrastructure_requirements
  - data_findings_report
  type: serial
  phase: initial_audit_collect
- id: T13
  from: architecture-planner
  to: code-implementer
  condition: no_specialized_audits_needed OR all_audits_complete
  artifacts:
  - system_architecture_document
  - adrs
  - implementation_plan
  - component_specifications
  - data_flow_diagram
  - threat_model
  - security_requirements
  - security_checklist
  - security_findings_report
  - ui_component_specifications
  - user_flow_diagrams
  - accessibility_requirements
  - ui_findings_report
  - pipeline_configurations
  - data_models
  - optimized_queries
  - infrastructure_requirements
  - data_findings_report
  artifact_groups:
    must_read:
    - system_architecture_document
    - implementation_plan
    - component_specifications
    - adrs
    reference:
    - data_flow_diagram
    - threat_model
    - security_requirements
    - security_checklist
    - security_findings_report
    - ui_component_specifications
    - user_flow_diagrams
    - accessibility_requirements
    - ui_findings_report
    optional:
    - pipeline_configurations
    - data_models
    - optimized_queries
    - infrastructure_requirements
    - data_findings_report
  type: serial
  audit_tracking:
  - security-auditor
  - ui-ux-accessibility-specialist
  - data-engineering-architect
  aggregate_handoff: true
- id: T34
  from: code-implementer
  to: code-reviewer
  condition: no_fix_flags_present
  artifacts:
  - source_code
  - unit_tests
  - implementation_report
  type: serial
  state: implementing
- id: T43
  from: code-reviewer
  to: code-implementer
  condition: issues_found AND code_review_iteration < 3
  artifacts:
  - code_review_report
  - quality_metrics
  - improvement_recommendations
  type: loop
  process: code_review_bug_fixes
- id: T43_TEST
  from: code-reviewer
  to: code-implementer
  condition: test_fix_review AND code_review_iteration < 3
  artifacts:
  - code_review_report
  - quality_metrics
  - improvement_recommendations
  type: loop
  process: code_review_bug_fixes
  state: fixing_test
- id: T43_PERF
  from: code-reviewer
  to: code-implementer
  condition: perf_fix_review AND code_review_iteration < 3
  artifacts:
  - code_review_report
  - quality_metrics
  - improvement_recommendations
  type: loop
  process: code_review_bug_fixes
  state: fixing_perf
- id: T45a
  from: code-reviewer
  to: comprehensive-test-engineer
  condition: code_review_pass OR code_review_iteration >= 3
  artifacts:
  - source_code
  - unit_tests
  - implementation_report
  - code_review_report
  - quality_metrics
  - improvement_recommendations
  - system_architecture_document
  - adrs
  type: parallel_start
- id: T45b
  from: code-reviewer
  to: performance-analyst
  condition: code_review_pass OR code_review_iteration >= 3
  artifacts:
  - source_code
  - unit_tests
  - implementation_report
  - code_review_report
  - quality_metrics
  - improvement_recommendations
  - system_architecture_document
  - adrs
  type: parallel_start
- id: T51_3
  from: comprehensive-test-engineer
  to: code-implementer
  condition: bugs_found AND test_iteration < 3
  artifacts:
  - testing_report
  - bug_reports
  type: loop
  process: testing_bug_fixes
  state: fixing_test
- id: T51_6
  from: comprehensive-test-engineer
  to: devops-infrastructure-engineer
  condition: tests_pass OR test_iteration >= 3
  artifacts:
  - testing_report
  - coverage_metrics
  - tested_application
  type: parallel_join
- id: T52_3
  from: performance-analyst
  to: code-implementer
  condition: bottlenecks_found AND performance_iteration < 3
  artifacts:
  - profiling_report
  - optimization_recommendations
  type: loop
  process: performance_optimization
  state: fixing_perf
- id: T52_6
  from: performance-analyst
  to: devops-infrastructure-engineer
  condition: performance_pass OR performance_iteration >= 3
  artifacts:
  - profiling_report
  - load_test_results
  - optimized_application
  type: parallel_join
- id: T67
  from: devops-infrastructure-engineer
  to: tech-docs-writer
  condition: (deployment_complete AND NOT infrastructure_code_needs_review) OR infrastructure_review_iteration >= 3
  artifacts:
  - container_images
  - deployment_manifests
  - ci_cd_pipeline
  - monitoring_dashboards
  type: serial
- id: T70
  from: tech-docs-writer
  to: project-manager
  condition: documentation_complete OR documentation_iteration >= 3
  artifacts:
  - api_documentation
  - user_guides
  - runbooks
  - release_notes
  type: serial
- id: T70_REV
  from: project-manager
  to: tech-docs-writer
  condition: documentation_needs_revision AND documentation_iteration < 3
  artifacts:
  - revision_requests
  - feedback_notes
  type: loop
  process: documentation_review
- id: T_CODE_TO_SEC
  from: code-implementer
  to: security-auditor
  condition: security_fixes_complete
  artifacts:
  - source_code
  - unit_tests
  - implementation_report
  type: loop
  process: security_bug_fixes
  state: fixing_security
- id: T_CODE_TO_UI
  from: code-implementer
  to: ui-ux-accessibility-specialist
  condition: ui_fixes_complete
  artifacts:
  - source_code
  - unit_tests
  - implementation_report
  type: loop
  process: ui_ux_bug_fixes
  state: fixing_ui
- id: T_CODE_TO_DATA
  from: code-implementer
  to: data-engineering-architect
  condition: data_fixes_complete
  artifacts:
  - source_code
  - unit_tests
  - implementation_report
  type: loop
  process: data_engineering_bug_fixes
  state: fixing_data
- id: T_SEC_VERIFY
  from: security-auditor
  to: code-implementer
  condition: security_findings_not_resolved AND security_verification_iteration < 3
  artifacts:
  - threat_model
  - security_requirements
  - security_checklist
  - security_findings_report
  type: loop
  process: security_bug_fixes
  phase: verification
- id: T_SEC_PASS
  from: security-auditor
  to: code-reviewer
  condition: security_verification_pass OR security_verification_iteration >= 3
  artifacts:
  - source_code
  - unit_tests
  - implementation_report
  - threat_model
  - security_requirements
  - security_checklist
  - security_findings_report
  type: serial
  process: security_bug_fixes
  phase: verification
- id: T_UI_VERIFY
  from: ui-ux-accessibility-specialist
  to: code-implementer
  condition: ui_findings_not_resolved AND ui_verification_iteration < 3
  artifacts:
  - ui_component_specifications
  - user_flow_diagrams
  - accessibility_requirements
  - ui_findings_report
  type: loop
  process: ui_ux_bug_fixes
  phase: verification
- id: T_UI_PASS
  from: ui-ux-accessibility-specialist
  to: code-reviewer
  condition: ui_verification_pass OR ui_verification_iteration >= 3
  artifacts:
  - source_code
  - unit_tests
  - implementation_report
  - ui_component_specifications
  - user_flow_diagrams
  - accessibility_requirements
  - ui_findings_report
  type: serial
  process: ui_ux_bug_fixes
  phase: verification
- id: T_DATA_VERIFY
  from: data-engineering-architect
  to: code-implementer
  condition: data_findings_not_resolved AND data_verification_iteration < 3
  artifacts:
  - pipeline_configurations
  - data_models
  - optimized_queries
  - infrastructure_requirements
  - data_findings_report
  type: loop
  process: data_engineering_bug_fixes
  phase: verification
- id: T_DATA_PASS
  from: data-engineering-architect
  to: code-reviewer
  condition: data_verification_pass OR data_verification_iteration >= 3
  artifacts:
  - source_code
  - unit_tests
  - implementation_report
  - pipeline_configurations
  - data_models
  - optimized_queries
  - infrastructure_requirements
  - data_findings_report
  type: serial
  process: data_engineering_bug_fixes
  phase: verification
- id: T_DATA_TO_DEVOPS
  from: data-engineering-architect
  to: devops-infrastructure-engineer
  condition: deployment_only
  artifacts:
  - pipeline_configurations
  - data_models
  - infrastructure_requirements
  type: conditional
  process: main_workflow
  phase: initial_audit_collect
- id: T_CODE_TO_TEST
  from: code-implementer
  to: code-reviewer
  condition: test_fixes_complete
  artifacts:
  - source_code
  - unit_tests
  - implementation_report
  type: loop
  process: testing_bug_fixes
  state: fixing_test
- id: T_CODE_TO_PERF
  from: code-implementer
  to: code-reviewer
  condition: perf_fixes_complete
  artifacts:
  - source_code
  - unit_tests
  - implementation_report
  type: loop
  process: performance_optimization
  state: fixing_perf
- id: T_DEVOPS_REVIEW
  from: devops-infrastructure-engineer
  to: code-reviewer
  condition: infrastructure_code_needs_review AND infrastructure_review_iteration < 3
  artifacts:
  - dockerfiles
  - terraform_configs
  - kubernetes_manifests
  - ci_cd_configs
  type: loop
  process: infrastructure_review
- id: T_DEVOPS_REVIEW_FAIL
  from: code-reviewer
  to: devops-infrastructure-engineer
  condition: NOT infrastructure_review_pass AND infrastructure_review_iteration < 3
  artifacts:
  - code_review_report
  type: loop
  process: infrastructure_review
- id: T_DEVOPS_REVIEW_PASS
  from: code-reviewer
  to: devops-infrastructure-engineer
  condition: infrastructure_review_pass
  artifacts:
  - code_review_report
  type: serial
  process: infrastructure_review
- id: T_DEVOPS_REVIEW_FORCE_PASS
  from: code-reviewer
  to: devops-infrastructure-engineer
  condition: NOT infrastructure_review_pass AND infrastructure_review_iteration >= 3
  artifacts:
  - code_review_report
  type: serial
  process: infrastructure_review
processes:
- id: main_workflow
  name: Main Development Workflow
  description: Primary development flow. Specialized Phase 1 audits return to architecture-planner for
    aggregation before implementation.
  steps:
