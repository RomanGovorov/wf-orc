  backlog_template: '# Product Backlog


    | ID | Title | Description | Priority | Status | Assigned Agent | Created | Deadline |

    |----|-------|-------------|----------|--------|----------------|---------|----------|

    | TSK-001 | Example task | Description | HIGH | BACKLOG | architecture-planner | 2026-04-27 | 2026-05-01
    |


    ## Status Legend

    - **BACKLOG** — in queue

    - **IN_PROGRESS** — in progress

    - **REVIEW** — under review

    - **DONE** — completed

    - **BLOCKED** — blocked

    - **CANCELLED** — cancelled

    '
# Counter Increment Rules:
# Counters increment EACH time an agent re-runs for fixes (loop transition fires).
# Specifically: increment AFTER receiving a loop result (issues_found, bugs_found, etc.)
# and BEFORE re-launching the fixing agent. The orchestrator tracks all counters.
iteration_counters:
  code_review_iteration:
    owner: code-reviewer
    scope: application_code_review
    max: 3
    description: code-reviewer finds issues → code-implementer fixes → code-reviewer re-reviews
  test_fix_review_iteration:
    owner: code-reviewer
    scope: test_fix_review
    max: 3
    description: code-reviewer reviews test fixes → code-implementer re-fixes → code-reviewer re-reviews
  perf_fix_review_iteration:
    owner: code-reviewer
    scope: performance_fix_review
    max: 3
    description: code-reviewer reviews perf fixes → code-implementer re-fixes → code-reviewer re-reviews
  infrastructure_review_iteration:
    owner: code-reviewer
    scope: infrastructure_code_review
    max: 3
    description: code-reviewer reviews devops-infrastructure-engineer infra code → devops-infrastructure-engineer fixes → code-reviewer re-reviews
  security_verification_iteration:
    owner: security-auditor
    scope: security_bug_fixes
    max: 3
    description: security-auditor Phase 2 finds issues → code-implementer fixes → security-auditor re-verifies
  ui_verification_iteration:
    owner: ui-ux-accessibility-specialist
    scope: ui_ux_bug_fixes
    max: 3
    description: ui-ux-accessibility-specialist Phase 2 finds issues → code-implementer fixes → ui-ux-accessibility-specialist re-verifies
  data_verification_iteration:
    owner: data-engineering-architect
    scope: data_engineering_bug_fixes
    max: 3
    description: data-engineering-architect Phase 2 finds issues → code-implementer fixes → data-engineering-architect re-verifies
  test_iteration:
    owner: comprehensive-test-engineer
    scope: testing_bug_fixes
    max: 3
    description: test-engineer finds bugs → code-implementer fixes → code-reviewer → test-engineer re-tests
  performance_iteration:
    owner: performance-analyst
    scope: performance_optimization
    max: 3
    description: performance-analyst finds bottlenecks → code-implementer fixes → code-reviewer → performance-analyst re-profiles
  documentation_iteration:
    owner: tech-docs-writer
    scope: documentation_review
    max: 3
    description: project-manager requests doc revision → tech-docs-writer revises → project-manager re-reviews

# ═══════════════════════════════════════════════════════════════════════════════
# Counter Reset Rules (applied by the orchestrator)
# ═══════════════════════════════════════════════════════════════════════════════
# Counters RESET when the workflow advances PAST the loop they guard. A stale counter
# left at max causes spurious multi-transition matches — e.g. code_review_iteration=3
# left over from a forced pass would make T45a/T45b match AGAIN (via their ">= 3"
# clauses) the next time code-reviewer runs in test-fix-review context, conflicting
# with T43_TEST.
#
# APPLICATION ORDER after each agent completes (strict):
#   1. Evaluate ALL outgoing transition conditions using PRE-RESET counter values
#   2. Select and fire the matching transition(s)
#   3. Apply every reset rule triggered by the fired transition(s) — ONCE per event
#      (T45a+T45b fire together as one parallel_start event → one reset, not two)
#   4. Launch the target agent(s)
# A reset NEVER retroactively changes the evaluation that triggered it.
counter_reset_rules:
- id: RST_APP_REVIEW_ON_T45
  trigger: T45a/T45b fire (workflow advances from application code review into the parallel
    test+performance phase)
  reset_to_zero:
  - code_review_iteration
  - test_fix_review_iteration
  - perf_fix_review_iteration
  rationale: >
    Application review is concluded. All later code-reviewer runs (test-fix review via
    T_CODE_TO_TEST, perf-fix review via T_CODE_TO_PERF) are fresh review cycles and get
    fresh budgets. Preserves the forced-exit property: when test_fix_review_iteration or
    perf_fix_review_iteration reaches max, T45a/b force-fire — and the reset then clears
    them so the next cycle is not born force-passed.
  must_not_reset:
  - counter: test_iteration
    reason: bounds the OUTER test cycle (T51_3 re-entry requires < 3); resetting it would
      allow unbounded test→fix→retest looping
  - counter: performance_iteration
    reason: bounds the OUTER performance cycle (T52_3)
  - counter: infrastructure_review_iteration
    reason: separate scope; infrastructure review has not started when T45 fires
