    - docs/ui-ux/user-flow-diagrams.md
    - docs/ui-ux/findings/PHASE*-*.md
    reads:
    - docs/architecture/ (architecture documents)
    updates:
    - tasks/active/TSK-<NNN>_<slug>.md (artifacts section)
  - agent: data-engineering-architect
    creates:
