    - docs/data/data-models.md
    - docs/data/optimized-queries.md
    - docs/data/infrastructure-requirements.md
    - docs/data/findings/PHASE*-*.md
    reads:
    - docs/architecture/ (architecture documents)
    updates:
    - tasks/active/TSK-<NNN>_<slug>.md (artifacts section)
  - agent: code-implementer
    creates:
    - Source code (project-specific location)
    - test/unit/test_<component>_<scenario>.py
    reads:
    - docs/architecture/ (architecture documents)
    - docs/security/ (security requirements)
